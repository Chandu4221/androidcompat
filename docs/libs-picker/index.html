<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AndroidCompat Libs Picker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "media",
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              android: { DEFAULT: "#3DDC84", dark: "#073042", light: "#EAF6F6" },
              page: "var(--color-page)",
              surface: "var(--color-surface)",
              card: "var(--color-card)",
              border: "var(--color-border)",
              textMain: "var(--color-text-main)",
              textMuted: "var(--color-text-muted)",
              successText: "var(--color-success-text)",
              successBg: "var(--color-success-bg)",
              errorText: "var(--color-error-text)",
              errorBg: "var(--color-error-bg)",
              warningText: "var(--color-warning-text)",
              warningBg: "var(--color-warning-bg)",
            },
          },
        },
      };
    </script>
    <!-- DevIcons & FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      :root {
        /* Light Theme Default */
        --color-page: #f9fafb;
        --color-surface: #ffffff;
        --color-card: #f3f4f6;
        --color-border: #e5e7eb;
        --color-text-main: #111827;
        --color-text-muted: #4b5563;
        --color-success-text: #15803d;
        --color-success-bg: #dcfce7;
        --color-error-text: #b91c1c;
        --color-error-bg: #fee2e2;
        --color-warning-text: #b45309;
        --color-warning-bg: #fef3c7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          /* Dark Theme */
          --color-page: #0b0f19;
          --color-surface: #111827;
          --color-card: #1f2937;
          --color-border: #374151;
          --color-text-main: #f9fafb;
          --color-text-muted: #d1d5db;
          --color-success-text: #4ade80;
          --color-success-bg: rgba(34, 197, 94, 0.1);
          --color-error-text: #f87171;
          --color-error-bg: rgba(239, 68, 68, 0.1);
          --color-warning-text: #fcd34d;
          --color-warning-bg: rgba(245, 158, 11, 0.1);
        }
      }
      body {
        background-color: var(--color-page);
        color: var(--color-text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .bg-surface { background-color: var(--color-surface); }
      .bg-card { background-color: var(--color-card); }
    </style>
  </head>
  <body class="antialiased min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-surface border-b border-border shadow-md p-4 sticky top-0 z-10">
      <div class="w-full flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-full bg-android/10 flex items-center justify-center border border-android/20">
            <i class="devicon-android-plain text-android text-3xl"></i>
          </div>
          <div>
            <h1 class="text-xl md:text-2xl font-bold text-textMain leading-tight">
              AndroidCompat Libs Picker
            </h1>
            <div class="flex items-center gap-3">
              <p class="text-xs md:text-sm text-textMuted">
                Static diagnostic tool. Select your core toolchain and optional libraries.
              </p>
            </div>
          </div>
        </div>
        <div class="hidden md:flex items-center gap-4 text-xs font-medium">
            <a href="../" class="text-textMuted hover:text-android transition flex items-center gap-2 bg-page px-3 py-1.5 rounded-lg border border-border">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
      </div>
    </header>

    <main class="w-full max-w-5xl mx-auto p-2 flex-grow flex flex-col gap-2 mt-2">
      <div id="loading" class="text-center py-12 text-textMuted font-medium animate-pulse">
        <i class="fas fa-spinner fa-spin text-xl mb-2"></i><br/>Loading compatibility data...
      </div>

      <div id="picker-ui" class="hidden flex flex-col gap-2">
        <!-- Core Toolchain -->
        <div class="bg-surface border border-border p-5 rounded-xl shadow-sm">
          <h2 class="text-lg font-bold text-textMain mb-4 flex items-center gap-2">
            <i class="devicon-android-plain text-android"></i> Core Toolchain
          </h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-bold text-textMuted uppercase mb-1">AGP</label>
              <select id="sel-agp" class="w-full bg-page border border-border text-textMain text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-android/50 focus:border-android outline-none transition"></select>
            </div>
            <div>
              <label class="block text-xs font-bold text-textMuted uppercase mb-1">Gradle</label>
              <select id="sel-gradle" class="w-full bg-page border border-border text-textMain text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-android/50 focus:border-android outline-none transition"></select>
            </div>
            <div>
              <label class="block text-xs font-bold text-textMuted uppercase mb-1">Kotlin</label>
              <select id="sel-kotlin" class="w-full bg-page border border-border text-textMain text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-android/50 focus:border-android outline-none transition"></select>
            </div>
            <div>
              <label class="block text-xs font-bold text-textMuted uppercase mb-1">KSP</label>
              <select id="sel-ksp" class="w-full bg-page border border-border text-textMain text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-android/50 focus:border-android outline-none transition"></select>
            </div>
          </div>
          <!-- Global Hints Container -->
          <div id="hints-container" class="mt-4 empty:hidden"></div>
        </div>

        <!-- Libraries -->
        <div class="bg-surface border border-border p-5 rounded-xl shadow-sm">
          <div class="flex items-center justify-between mb-4">
             <h2 class="text-lg font-bold text-textMain flex items-center gap-2">
               <i class="fas fa-cubes text-android"></i> Optional Libraries
             </h2>
             <p class="text-xs text-textMuted hidden sm:block">
               Leave as "None" to skip.
             </p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-bold text-textMuted uppercase mb-1">Hilt</label>
              <select id="sel-hilt" class="w-full bg-page border border-border text-textMain text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-android/50 focus:border-android outline-none transition"></select>
            </div>
            <div>
              <label class="block text-xs font-bold text-textMuted uppercase mb-1">Room</label>
              <select id="sel-room" class="w-full bg-page border border-border text-textMain text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-android/50 focus:border-android outline-none transition"></select>
            </div>
            <div>
              <label class="block text-xs font-bold text-textMuted uppercase mb-1">Compose</label>
              <select id="sel-compose" class="w-full bg-page border border-border text-textMain text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-android/50 focus:border-android outline-none transition"></select>
            </div>
            <div>
              <label class="block text-xs font-bold text-textMuted uppercase mb-1">Navigation</label>
              <select id="sel-navigation" class="w-full bg-page border border-border text-textMain text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-android/50 focus:border-android outline-none transition"></select>
            </div>
          </div>
        </div>

        <button id="btn-check" class="w-full bg-android hover:bg-green-400 text-android-dark font-bold text-sm md:text-base py-3 px-4 rounded-xl shadow-md transition-colors flex justify-center items-center gap-2">
          <i class="fas fa-stethoscope"></i> Check Compatibility
        </button>

        <!-- Results -->
        <div id="results" class="flex flex-col gap-2"></div>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
