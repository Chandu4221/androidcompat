name: on-demand-build
on:
  workflow_dispatch:
    inputs:
      agp_variant:
        description: 'agp8 or agp9'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment: build-approval   # <-- this line is what makes it pause
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile stub
        run: echo "would build stubs/${{ inputs.agp_variant }} here"
      - name: Write result
        run: echo '{"status":"verified"}' > docs/data/${{ inputs.agp_variant }}/compat.json
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/${{ inputs.agp_variant }}/compat.json
          git commit -m "on-demand build result" || echo "nothing to commit"
          git push
