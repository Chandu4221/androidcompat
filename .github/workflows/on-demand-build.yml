name: On-Demand Compatibility Build

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to reprocess (for manual testing/retries)"
        required: false

permissions:
  issues: write
  contents: read

jobs:
  process-request:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'build-request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Parse and Validate Request
        id: parse
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let issueNumber, issueBody;

            if (context.eventName === 'workflow_dispatch') {
              issueNumber = context.payload.inputs.issue_number || '';
              if (!issueNumber) {
                core.setFailed('No issue_number provided for manual dispatch.');
                return;
              }
              const { data: issue } = await github.rest.issues.get({
                issue_number: parseInt(issueNumber),
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              issueBody = issue.body;
            } else {
              issueNumber = context.payload.issue.number;
              issueBody = context.payload.issue.body;
            }

            if (!issueNumber || !issueBody) {
              core.setFailed('Could not extract issue number or body.');
              return;
            }

            const foundationMatch = issueBody.match(/### Foundation ID\s*\n\s*([a-f0-9]{16})/i);
            const foundationId = foundationMatch ? foundationMatch[1].trim() : null;

            if (!foundationId) {
              core.setFailed('Missing or invalid Foundation ID. Must be a 16-character hex ID.');
              return;
            }

            const addonsMatch = issueBody.match(/### Addons\s*\n\s*([\s\S]*?)(?:\n\n###|\n\n---|$)/i);
            const addonsText = addonsMatch ? addonsMatch[1].trim() : '';

            if (!addonsText) {
              core.setFailed('Missing Addons section. At least one library is required.');
              return;
            }

            const addons = [];
            const lines = addonsText.split('\n');
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('```')) continue;
              
              const parts = trimmed.split(':');
              if (parts.length === 3) {
                addons.push({
                  group: parts[0].trim(),
                  artifact: parts[1].trim(),
                  version: parts[2].trim()
                });
              }
            }

            if (addons.length === 0) {
              core.setFailed('No valid addon coordinates found. Expected format: group:artifact:version');
              return;
            }

            if (addons.length > 5) {
              core.setFailed('Too many addons. Maximum 5 per request.');
              return;
            }

            const agp8Data = JSON.parse(fs.readFileSync('docs/data/agp8/compat.json', 'utf8'));
            const agp9Data = JSON.parse(fs.readFileSync('docs/data/agp9/compat.json', 'utf8'));
            const allCombos = [...agp8Data.results, ...agp9Data.results];
            const combo = allCombos.find(c => c.id === foundationId);

            if (!combo) {
              core.setFailed(`Foundation ID ${foundationId} not found in verified combos. Check the dashboard for valid IDs.`);
              return;
            }

            core.setOutput('issue_number', issueNumber);
            core.setOutput('foundation_id', foundationId);
            core.setOutput('combo_json', JSON.stringify(combo));
            core.setOutput('addons_json', JSON.stringify(addons));
            core.setOutput('addons_count', addons.length);

      - name: Comment Validation Failure
        if: failure() && steps.parse.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = '${{ steps.parse.outputs.issue_number }}';
            if (!issueNumber) return;

            github.rest.issues.createComment({
              issue_number: parseInt(issueNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### ❌ Request Validation Failed\n\nYour build request could not be processed. Please check:\n\n1. **Foundation ID** is a valid 16-character hex ID from the dashboard\n2. **Addons** are in `group:artifact:version` format, one per line\n3. Maximum 5 addons per request\n\nFeel free to edit your issue or create a new one with corrected values."
            });

            github.rest.issues.update({
              issue_number: parseInt(issueNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              labels: ['build-request', 'invalid']
            });

      - name: Setup Go
        if: success()
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Metadata Gate (Level 0)
        if: success()
        id: metacheck
        env:
          FOUNDATION_JSON: ${{ steps.parse.outputs.combo_json }}
          ADDONS_JSON: ${{ steps.parse.outputs.addons_json }}
        run: |
          COMPILE_SDK=$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.compileSdk')
          JDK=$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.jdk')
          go run cmd/metadata-check/main.go \
            --libs="$ADDONS_JSON" \
            --compile-sdk=$COMPILE_SDK \
            --jdk=$JDK \
            --out=metadata-failures.json

      - name: Comment Metadata Failure
        if: failure() && steps.metacheck.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const issueNumber = '${{ steps.parse.outputs.issue_number }}';
            if (!issueNumber) return;

            let failures = [];
            if (fs.existsSync('metadata-failures.json')) {
              failures = JSON.parse(fs.readFileSync('metadata-failures.json', 'utf8'));
            }

            let body = "### ❌ Metadata Gate Failed\n\nThe requested addons are **incompatible** with the selected Foundation based on declared metadata. The build was skipped to save CI resources.\n\n";
            for (const f of failures) {
              body += `- ${f}\n`;
            }
            body += "\n**Suggestion:** Choose a Foundation with a higher compileSdk/JDK, or use an older version of the library.";

            github.rest.issues.createComment({
              issue_number: parseInt(issueNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

            github.rest.issues.update({
              issue_number: parseInt(issueNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              labels: ['build-request', 'metadata-failed']
            });

      - name: Setup JDK 17
        if: success()
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build Bridge JAR
        if: success()
        run: |
          cd tools/gradle-bridge
          ./gradlew shadowJar --no-daemon
          cd ../..

      - name: Prepare and Run Build
        if: success()
        env:
          FOUNDATION_JSON: ${{ steps.parse.outputs.combo_json }}
          ADDONS_JSON: ${{ steps.parse.outputs.addons_json }}
          FOUNDATION_ID: ${{ steps.parse.outputs.foundation_id }}
          ISSUE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          AGP_MAJOR=$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.agp' | cut -d'.' -f1)
          STUB_DIR="stubs/agp${AGP_MAJOR}"

          if [ ! -d "$STUB_DIR" ]; then
            echo "❌ Stub directory not found: $STUB_DIR"
            exit 1
          fi

          cp -r "$STUB_DIR" tmp-build

          go run cmd/inject/main.go \
            --dir=tmp-build \
            --agp="$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.agp')" \
            --gradle="$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.gradle')" \
            --kotlin="$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.kotlin')" \
            --ksp="$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.ksp')" \
            --compile-sdk="$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.compileSdk')" \
            --agp-major=$AGP_MAJOR \
            --libs="$ADDONS_JSON"

          cd tmp-build
          "$JAVA_HOME_17_X64/bin/java" -jar ${GITHUB_WORKSPACE}/tools/gradle-bridge/app/build/libs/gradle-bridge.jar \
            --project-dir . \
            --tasks build \
            --java-home "$JAVA_HOME" \
            > bridge-output.json \
            2> stdout.log \
            || true
          cd ..

      - name: Collect Result
        if: always() && steps.parse.outcome == 'success' && steps.metacheck.outcome != 'failure'
        env:
          FOUNDATION_JSON: ${{ steps.parse.outputs.combo_json }}
          ADDONS_JSON: ${{ steps.parse.outputs.addons_json }}
          FOUNDATION_ID: ${{ steps.parse.outputs.foundation_id }}
          ISSUE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          go run cmd/collect/main.go \
            --id="${FOUNDATION_ID}-ondemand" \
            --agp="$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.agp')" \
            --gradle="$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.gradle')" \
            --kotlin="$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.kotlin')" \
            --ksp="$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.ksp')" \
            --compile-sdk="$(echo "$FOUNDATION_JSON" | jq -r '.coreToolchain.compileSdk')" \
            --workflow-url="$ISSUE_URL" \
            --dir=tmp-build \
            --out=. \
            --bridge-json=tmp-build/bridge-output.json \
            --libs="$ADDONS_JSON"

      - name: Comment Result on Issue
        if: always() && steps.metacheck.outcome != 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const issueNumber = '${{ steps.parse.outputs.issue_number }}';
            if (!issueNumber) return;

            const resultFile = "result-${{ steps.parse.outputs.foundation_id }}-ondemand.json";
            let commentBody;

            if (fs.existsSync(resultFile)) {
              const result = JSON.parse(fs.readFileSync(resultFile, 'utf8'));
              const status = result.status === 'verified' ? '✅' : '❌';
              const statusText = result.status === 'verified' ? 'COMPATIBLE' : 'INCOMPATIBLE';
              
              commentBody = `### ${status} Compatibility Result: ${statusText}\n\n`;
              commentBody += `**Foundation:** \`${result.coreToolchain.agp}\` / Gradle \`${result.coreToolchain.gradle}\` / Kotlin \`${result.coreToolchain.kotlin}\`\n\n`;
              
              if (result.libraries && result.libraries.length > 0) {
                commentBody += `**Addons tested:**\n`;
                for (const lib of result.libraries) {
                  commentBody += `- \`${lib.name}:${lib.version}\`\n`;
                }
                commentBody += `\n`;
              }
              
              commentBody += `**Verification:**\n`;
              commentBody += `- Sync: ${result.verification.sync}\n`;
              commentBody += `- Compile: ${result.verification.compile}\n`;
              commentBody += `- Unit Test: ${result.verification.unitTest}\n\n`;
              
              if (result.errorMessage) {
                commentBody += `**Error:**\n\`\`\`\n${result.errorMessage}\n\`\`\`\n\n`;
              }
              
              commentBody += `[View full workflow run](${result.workflowUrl})`;
            } else {
              commentBody = "### ⚠️ Build Error\n\nThe workflow encountered an infrastructure error and could not produce a result. Please try again or report this issue.";
            }

            github.rest.issues.createComment({
              issue_number: parseInt(issueNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

            github.rest.issues.update({
              issue_number: parseInt(issueNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
